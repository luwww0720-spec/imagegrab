<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片工作台 · 图采集 ImageGrab</title><link rel="stylesheet" href="gallery.css"></head><body>
<header><a class="brand" href="gallery.html"><span class="mark">▧</span> 图采集 <small>ImageGrab</small></a><span class="privacy">本地处理 · 图片无需上传</span></header>
<main><div class="heading"><div><p class="eyebrow">YOUR IMAGE WORKSPACE</p><h1>好图片，一次收好。</h1><p id="source-title">正在读取商品图片…</p><a id="source-link" target="_blank" rel="noopener noreferrer"></a></div><div class="stats"><strong id="total">0</strong><span>张商品图片</span></div></div>
<section class="toolbar" aria-label="筛选与下载"><div class="selection"><button id="select-all">全选</button><button id="invert">反选</button><label class="check"><input type="checkbox" id="only-selected">仅显示选中</label></div><div class="filters"><label>最小尺寸 <select id="min-size"><option value="100">100 px</option><option value="300">300 px</option><option value="600">600 px</option></select></label><span id="selected-count">已选 0 张</span><button class="primary" id="download" disabled>↓ 下载选中 · PNG</button></div></section>
<div id="status" role="status" aria-live="polite">图片只保存在当前浏览器，请只下载你有权使用的素材。</div><progress id="progress" max="1" value="0" hidden></progress>
<section id="grid" class="grid" aria-label="商品图片"></section><div id="empty" class="empty" hidden>还没有图片。请在支持的商品详情页点击右下角「获取图片」。</div>
<footer><span>图采集 ImageGrab</span><span>筛选 · 勾选 · 统一 PNG · 批量保存</span></footer></main><script src="gallery.js"></script></body></html>
